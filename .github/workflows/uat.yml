name: uat

on:
  push:
    branches: [uat]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-0a72aed387d238c51

jobs:
  uat:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::769377363947:role/arithlab-uat-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu -i bash /home/ubuntu/scripts/deploy-backend.sh"]' \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)
          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "${{ env.INSTANCE_ID }}" \
              --query 'Status' --output text)
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ env.INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
